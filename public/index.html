<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Connexion · ChronoSquad</title>
        <link rel = "stylesheet" href = "css/style.css">
    </head>
    <body> 
        <header class = "topbar">
            <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true"></span>ChronoSquad</a>
        </header>

        <main class="auth">
            <form id="login-form" class="card" novalidate>
                <h1>Connexion</h1>
                <p class="lede">Retrouvez les agendas de votre équipe.</p>

                <p id="error" class="error" role="alert" hidden></p>

                <label for="username">Nom d'utilisateur</label>
                <input id="username" name="username" type="text" autocomplete="username" autofocus>

                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" autocomplete="current-password">

                <button type="submit" class="btn btn-primary">Se connecter</button>

                <p class="hint">Pas encore de compte? <a href="templates/register.html">Créer un compte</a></p>
            </form>
        </main>

        <script src="js/api.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
